<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Navjot Singh Chahal</title>
    <!--
      GitHub Pages SPA fallback. Pages serves this file for any unknown path
      (e.g. a direct visit to /projects). It rewrites the URL to the app's
      index with the original path encoded after `?/`, which the snippet in
      index.html decodes back before React Router boots.
      pathSegmentsToKeep = 0 because this is a root user/org page.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
