    <!--
      GitHub Pages SPA redirect decoder. The 404.html fallback encodes a
      deep-link path after `?/`; this restores the real URL before React
      Router mounts, so direct visits and refreshes on /projects etc. work.
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
